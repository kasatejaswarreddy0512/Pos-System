global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'POS System Application'
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    static_configs:
      - targets:
          - 'host.docker.internal:8081'
        labels:
          application: 'POS System Application'

